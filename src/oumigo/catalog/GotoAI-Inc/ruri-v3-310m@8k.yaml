id: ruri-v3-310m@8k
# Our byte-identical mirror of cl-nagoya/ruri-v3-310m at 18b60fb, so the service does not
# depend on the upstream repo staying up (llm-quantizer/mirror/).
model: GotoAI-Inc/ruri-v3-310m-mirror
description: Ruri v3 310M, Japanese text embeddings (768-d), 8k context
task: embed
engine:
  max_model_len: 8192
  # What it needs on any GPU; the rest stays free for other workers. Measured
  # 2026-11-17 (16 GB GPU, vLLM 0.31.0): about 1.5 GiB in all, with
  # no KV cache (an encoder); bursts of 8 x 8,176 tokens ran the same at every share
  # tried, down to 0.05.
  gpu_memory_target_gib: 2.0
  # Used only when the target above is unset.
  gpu_memory_utilization: 0.85
  dtype: float16
  tensor_parallel_size: 1
  max_concurrent_requests: 8
  extra_args:
  # config.json says classifier_pooling: cls, but the model is trained and used with
  # mean pooling (its sentence-transformers 1_Pooling); pin it.
  - --pooler-config
  - '{"seq_pooling_type":"MEAN"}'
# Embedding requests take seconds, so a long wait means the model is overloaded: refuse
# with 503 model_busy after 30 s, not the router's 300 s, and let the client retry
# (gotoai-api-gateway docs/design_embedding-api-flow-control.md §5).
caps:
  max_queue_seconds: 30
embed:
  dimensions: 768
  # The model card's prefixes; the model's sentence-transformers config defines none.
  prompts:
    query: '検索クエリ: '
    document: '検索文書: '
    topic: 'トピック: '
requires:
  vllm: '>=0.28'
  # The smallest GPU worth giving it; the target above decides what it takes.
  min_vram_gib: 4
tested: '16 GB GPU, vLLM 0.28.0: matches sentence-transformers (cos >= 0.99999, fp16; bf16 only 0.9989), 1.5 GiB used'
