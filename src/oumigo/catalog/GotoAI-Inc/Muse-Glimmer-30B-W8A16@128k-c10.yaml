id: Muse-Glimmer-30B-W8A16@128k-c10
model: GotoAI-Inc/Muse-Glimmer-30B-W8A16
description: Muse Glimmer 30B, W8A16 (GotoAI-Inc quantization; no official W8A16), 128k context, 10 concurrent
  requests
engine:
  max_model_len: 131072
  gpu_memory_utilization: 0.95
  dtype: auto
  tensor_parallel_size: 1
  max_concurrent_requests: 10
  extra_args:
  - --enable-auto-tool-choice
  - --tool-call-parser
  - muse_glimmer
  - --reasoning-parser
  - muse_glimmer
requires:
  vllm: '>=0.28'
tested: maintainer-tested; hardware not recorded
