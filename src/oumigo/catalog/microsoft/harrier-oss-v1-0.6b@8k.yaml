id: harrier-oss-v1-0.6b@8k
model: microsoft/harrier-oss-v1-0.6b
description: Harrier OSS v1 0.6B, multilingual text embeddings (1024-d), 8k context
task: embed
engine:
  max_model_len: 8192
  # What it needs on any GPU; the rest stays free for other workers. Measured
  # 2026-11-17 (RTX 3080 Ti Laptop GPU 16 GB, vLLM 0.31.0): 1.64 GiB fixed (weights,
  # activations, CUDA graphs) plus 0.88 GiB of KV cache for one 8k input = 2.5 GiB;
  # bursts of 8 x 8,176 tokens ran as fast at 3 GiB as at 13.
  gpu_memory_target_gib: 3.0
  # Used only when the target above is unset.
  gpu_memory_utilization: 0.85
  dtype: bfloat16
  tensor_parallel_size: 1
  max_concurrent_requests: 8
embed:
  dimensions: 1024
  # From the model's config_sentence_transformers.json. Queries take an instruction;
  # documents are embedded as they are.
  prompts:
    query: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery: "
    document: ''
    sts: "Instruct: Retrieve semantically similar text\nQuery: "
    bitext: "Instruct: Retrieve parallel sentences\nQuery: "
requires:
  vllm: '>=0.28'
  # The smallest GPU worth giving it; the target above decides what it takes.
  min_vram_gib: 4
tested: 'RTX 3080 Ti Laptop GPU 16 GB, vLLM 0.28.0: matches sentence-transformers (cos >= 0.99994), 2.8 GiB used'
