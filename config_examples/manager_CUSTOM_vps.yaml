# oumigo manager configuration — CUSTOM provider on a VPS behind nginx (0.5.0+).
#
# Workers run anywhere (clouds other on-prem sites) and reach
# this manager through nginx at https://oumigo.example.net. See docs/tunnel.md for the
# nginx config and the worker-side settings.
#
# Secrets do NOT belong in this file. Reference them by path (see auth.token_file)
# or supply them via environment variables / a local .env file.

# CUSTOM: any vendor or site, no vendor-specific processing. mDNS off, worker auth always
# enforced, and the manager refuses to start if anything below would be exposed unsafely.
provider: CUSTOM

# --- Control plane: worker registration, heartbeat, metrics, /tunnel ---
control_plane:
  host: 127.0.0.1               # nginx terminates TLS on :443 and forwards here
  port: 7014
  trusted_proxies: [127.0.0.1]  # X-Forwarded-For is believed only from nginx
  # Without nginx, serve TLS directly (then host may be 0.0.0.0):
  # tls_cert_file: /etc/oumigo/tls/fullchain.pem
  # tls_key_file:  /etc/oumigo/tls/privkey.pem

# --- Data plane: the router. nginx forwards /v1/ here for remote clients. ---
data_plane:
  host: 127.0.0.1
  port: 7012
  # client_auth: true           # always on under CUSTOM: `oumigo manager apikey create`

# --- Reporting plane: view through an SSH tunnel (ssh -L 7080:127.0.0.1:7080 vps) ---
dashboard:
  host: 127.0.0.1
  port: 7080

# --- Tunnel transport: workers with OUMIGO_TRANSPORT=tunnel dial out to /tunnel ---
tunnel:
  enabled: true
  pool_spare: 1                 # connections kept beyond each worker's capacity

heartbeat:
  interval_s: 10
  timeout_s: 30
  forget_after_seconds: 3600

# --- Worker auth ---
# Per-pod join tokens: `oumigo manager token create --ttl 1h --uses 1 -c <this file>`.
# For a worker that restarts often (a laptop, a container image), create a long-lived one
# instead: `--ttl never --uses 0 --label <name>`, revocable with `token revoke <id>`.
# A reusable token (token_file or $OUMIGO_MANAGER_TOKEN) is optional.
auth:
  token_file: null
  state_dir: /var/lib/oumigo    # signing secret, minted tokens, revoked nodes (mode 0600)

# --- Optional: limit worker-facing endpoints to these source addresses / ranges ---
worker_allowlist:
  enabled: false
  addresses: []                 # e.g. ["203.0.113.7", "198.51.100.0/24"]

replicas: 1

# --- Model catalog: which profiles this fleet's workers may run ---
# A profile is one model with every start-time setting fixed (context length, memory
# share, concurrency, vLLM flags), and its id is the model id clients request. Shipped
# profiles: src/oumigo/catalog/. A worker picks one with OUMIGO_MODEL_PROFILE, or gets
# the default.
catalog:
  # dirs: [/etc/oumigo/catalog]   # your own profiles; an id here overrides a shipped one
  allow:
    - gemma-4-12B-it-qat-w4a16-ct@128k
    - gemma-4-31B-it-qat-w4a16-ct@64k
  default: gemma-4-12B-it-qat-w4a16-ct@128k

worker:
  vllm_port: 7001               # backend port workers prefer (each picks a free one)

# --- Inference-client defaults, served to clients at GET /agent-defaults ---------
# Fleet-wide fallback for profiles without their own `agent:` block. These bind
# `oumigo.api.agent` (the Python client), not the manager or the workers. Both are
# seconds; null = no limit.
agent:
  # Wall clock for ONE request(), spanning every tool-loop round-trip and tool call.
  turn_timeout: 90.0
  # How long one round-trip may return NO bytes before it is abandoned. Set it below
  # turn_timeout for it to mean anything on its own.
  stall_timeout: 120.0
