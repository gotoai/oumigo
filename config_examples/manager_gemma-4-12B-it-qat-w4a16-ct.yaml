# oumigo manager configuration (v1).
#
# This is a config file, resolved in precedence order:
#   --config-file <file>  >  $OUMIGO_CONFIG_file  >  ~/.config/oumigo/manager.yaml  >  /etc/oumigo/manager.yaml
# The manager reads `manager.yaml` (this file) and `model.yaml` (the single model)
# from that directory by convention.
#
# Secrets do NOT belong in this file. Reference them by path (see auth.token_file)
# or supply them via environment variables / a local .env file.

# --- Control plane: manager <-> worker coordination (registration, heartbeat) ---
control_plane:
  host: 0.0.0.0          # bind on all interfaces so LAN workers can reach it
  port: 7014

# --- Data plane: client inference requests routed to healthy workers ---
data_plane:
  host: 0.0.0.0
  port: 7012

# --- Worker liveness / registry retention ---
heartbeat:
  interval_s: 10         # expected worker heartbeat period
  timeout_s: 30          # mark a worker dead after this long without a heartbeat
  forget_after_seconds: 3600  # drop a long-absent node's identity from the registry

# --- Authentication (v1: shared bearer token) ---
auth:
  # Path to a file whose contents are the shared bearer token workers must present.
  # Precedence: $OUMIGO_MANAGER_TOKEN (env / .env) overrides this file.
  # If neither is set, worker authentication is DISABLED (v1) and the manager warns.
  token_file: null       # e.g. ./token  or  /etc/oumigo/token

# --- Provisioning backend: how worker nodes come into existence ---
# LAN    : workers are hand-started and self-register (no manager provisioning).
# conoha : (future) manager provisions ConoHa VPS instances via the cloud API.
provider: LAN

# --- Desired scale ---
# Only meaningful when the manager PROVISIONS workers (cloud / LAN). With static or
# hand-started LAN workers, the replica count is simply however many workers register.
replicas: 1


model:
  name: google/gemma-4-12B-it-qat-w4a16-ct  # REQUIRED, e.g. google/gemma-4-12B-it
  # Where the weights come from. Unset / null / `none` -> download `name` from the
  # Hugging Face Hub. A `file://` URI -> load from that directory on the *worker*
  # (each worker checks its own disk; a node without the files can opt out with
  # MODEL_STORAGE_LOCATION=none in its .env). Only file:// is supported for now.
  storage_location: none            # e.g. file:///srv/models/gemma-4-12b
  port: 7001                         # vLLM server port on each worker (data plane routes here)
  dtype: auto                        # auto | bfloat16 | float16
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.90
  max_model_len: 65536  # 64k        # null = model default
  max_concurrent_requests: 1         # maximum requests that can be processed simultaneously

  # --- Router-side capability caps (enforced by the manager, never sent to vLLM) ---
  # Measured on this checkpoint: one audio item is hard-capped by the processor at
  # audio_seq_length (750 tokens x 40 ms = 30 s) and anything longer is silently dropped,
  # so clients must chunk. Total audio is the limit that actually bites: past ~8 minutes
  # the model stops emitting new text and repeats a block until it hits the output
  # ceiling. The collapse is stochastic (24 clips came back clean while 20 did not), so
  # 6 minutes is the shipped value and 8 the highest that was ever trusted.
  # Audio past the cap is trimmed whole-clip, the model is told in the prompt, and the
  # response carries x-oumigo-audio-* headers.
  max_audio_seconds: 360             # 6 min. null / omitted = no cap.
  # Bounds the repetition loop directly: without it a degenerate generation runs to the
  # server ceiling and holds the worker slot, which a client cannot distinguish from a
  # hang. Also applied when the client sends no max_tokens at all — that is exactly the
  # shape of request that ran away. Matches oumi-gateway's own clamp.
  max_output_tokens: 4096            # null / omitted = no clamp.

  extra_args: #[]
    - --enable-auto-tool-choice
    - --tool-call-parser
    - gemma4
    - --reasoning-parser
    - gemma4