# oumigo_pods.py settings for the embedding models on one small rented GPU:
#
#   oumigo_pods.py -c /etc/oumigo/pods-embed.yaml up --wait
#
# The pod runs two profiles, one worker each, on one GPU (oumigo 0.5.6+). The GPU must
# hold the sum of their min_vram_gib: harrier@32k 8 + ruri 4 = 12 GiB, so 12 GB cards
# and up; smaller listed cards are skipped. Secrets as in pods.example.yaml.

name: oumigo-embed                         # also names the state file; one pod per name
image: ghcr.io/<owner>/oumigo-worker:0.5.6-vllm0.28.0-cu129
gpu_count: 1
disk_gb: 40                                # the unpacked image (Vast.ai counts it) + ~3 GB of weights and caches

search:
  providers:
    - vast.ai
    - secure.runpod
    - community.runpod
  max_price_per_hour: 0.30                 # USD; set your own bound
  retry_interval: 30
  timeout: 1800

runpod:
  gpu_types:
    - NVIDIA RTX 2000 Ada Generation
    - NVIDIA RTX A4500
    - NVIDIA RTX A4000
    - NVIDIA RTX 4000 Ada Generation
    - NVIDIA RTX A5000
  # registry_auth_id: <id>                 # RunPod registry credential, for a private image

vast:
  # Some names come in several sizes (RTX 3080: 10 or 12 GB; 4060 Ti / 5060 Ti: 8 or
  # 16 GB); only the ones big enough are offered.
  gpu_names: [RTX 3060, RTX 3080, RTX 3080 Ti, RTX 4070, RTX 4070 Ti, RTX 4060 Ti,
              RTX 5060 Ti, RTX A4000, RTX A5000]
  min_reliability: 0.98
  min_download_mbps: 500                   # the image is ~9 GB to pull
  max_download_usd_per_tb: 10
  # avoid_machines_hours: 24               # skip a machine that failed to start the container, or `down --avoid`
  # registry_user: <user>                  # for a private image, with REGISTRY_TOKEN

worker:
  manager_url: https://oumigo.example.com
  # Started in this order, largest first; each must be in the manager's catalog.allow.
  # `up --profile` overrides the list (comma-separated). Clients use harrier@32k: it
  # accepts everything harrier@8k does and gives the same vectors.
  profile: [harrier-oss-v1-0.6b@32k, ruri-v3-310m@8k]

join_token:
  ttl: 13h
  uses: 6                                  # each of the 2 workers registers once per container start

manager_config: /etc/oumigo/manager.yaml
